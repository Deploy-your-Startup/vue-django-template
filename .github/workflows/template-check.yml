name: Check generated full-stack project

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Coverage comment from the shared report action.
      pull-requests: write
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: template_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/template_check
      E2E_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/template_check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check rendered deployment contract
        run: bash tests/render_roles_test.sh
      - name: Test optional local coverage contract
        run: bash tests/coverage_harness_test.sh
      - name: Test standalone agent instructions and core ADRs
        run: bash tests/agent_instructions_test.sh
      - name: Render the project
        run: >-
          uv run --no-project --with copier==9.18.2 copier copy
          --defaults --vcs-ref HEAD
          --data project_name=template-check
          --data base_domain=example.com
          --data github_username=example
          . ../generated
      - name: Check that agent instructions ship with the project
        working-directory: ../generated
        run: |
          grep -qx '@AGENTS.md' CLAUDE.md
          test -f .github/git-commit-instructions.md
          adrs=$(grep -o 'docs/architecture/[^)]*\.md' AGENTS.md)
          test -n "$adrs"
          for adr in $adrs; do test -f "$adr" || { echo "missing $adr"; exit 1; }; done
      - name: Lint generated backend
        working-directory: ../generated/backend
        run: ./make.sh lint
      - name: Test generated backend
        working-directory: ../generated/backend
        run: ./make.sh coverage
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check generated frontend
        working-directory: ../generated/frontend
        run: npm ci && ./make.sh lint && ./make.sh test && ./make.sh build
      - name: Check public contracts and inferred helper returns
        run: bash tests/typing_policy_integration_test.sh ../generated
      - name: Check API client matches the backend schema
        working-directory: ../generated/backend
        run: ./make.sh generate_client --check
      - name: Install browser test dependencies
        working-directory: ../generated/e2e_tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test browser coverage reporting
        working-directory: ../generated/e2e_tests
        run: node --test support/coverage.disabled.integration.test.ts support/coverage.integration.test.ts
      - name: Test the generated application in a browser
        working-directory: ../generated/e2e_tests
        run: ./make.sh lint && STARTUP_COVERAGE=true ./make.sh test_e2e
      - name: Check the coverage harness contract
        working-directory: ../generated
        run: |
          # Backend: integration tests and the measured E2E server, combined.
          grep -q 'filename="api/routes.py"' backend/coverage/cobertura.xml
          ls backend/coverage/integration.coverage backend/coverage/e2e.coverage.*
          # Frontend: V8 coverage from the browser tests, mapped to src/.
          python3 -c 'import xml.etree.ElementTree as E; print("Frontend coverage files:", [c.get("filename") for c in E.parse("frontend/coverage/cobertura.xml").iter("class")])'
          grep -q 'filename="src/App.vue"' frontend/coverage/cobertura.xml
          ! grep -q 'services/backend/generated' frontend/coverage/cobertura.xml
      - name: Report coverage of the generated project
        uses: Deploy-your-Startup/deploy-template/.github/actions/coverage-report@b66121f4df8f2c7e9f67b96075ce8d85e81ec890
        with:
          title: Coverage of the generated project
          comment_key: generated-project
          files: |
            backend=../generated/backend/coverage/cobertura.xml
            frontend=../generated/frontend/coverage/cobertura.xml

  container-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash tests/container_e2e_test.sh
