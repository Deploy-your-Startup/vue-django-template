version: 2
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 2
    directories:
      - /template/deployment
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    open-pull-requests-limit: 2
    directories:
      - /template/backend
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directories:
      - /template/backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directories:
      - /template/frontend
    # typescript-eslint 8 supports TypeScript <6.1; lift with toolchain support.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directories:
      - /
      - /template
    schedule:
      interval: weekly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
