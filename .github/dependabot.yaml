version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /template/deployment
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production

  - package-ecosystem: uv
    directories:
      - /template/backend
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production

  - package-ecosystem: docker
    directories:
      - /template/backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directories:
      - /template/frontend
    # typescript-eslint 8 supports TypeScript <6.1; lift with toolchain support.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    schedule:
      interval: weekly
    groups:
      js-dev-dependencies:
        dependency-type: development
      js-prod-dependencies:
        dependency-type: production
