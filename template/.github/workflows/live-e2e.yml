name: Deployed full-stack E2E
on:
  workflow_run:
    workflows: ['Build and Deploy Backend', 'Build and Deploy Frontend']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-e2e
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_BASE_URL: https://§§deploy_your_startup.base_domain§§
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd e2e_tests && npm ci && npx playwright install --with-deps chromium
      - name: Wait for the deployed backend
        run: curl --fail --max-time 10 --retry 30 --retry-delay 5 --retry-all-errors "$E2E_BASE_URL/api/health"
      - run: cd e2e_tests && ./make.sh test_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-e2e-results
          path: e2e_tests/test-results/
