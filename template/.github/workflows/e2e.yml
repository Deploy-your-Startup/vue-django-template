name: API client contract
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/e2e.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/e2e.yml']
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd frontend && npm ci
      - run: cd backend && ./make.sh generate_client --check
