name: Full-stack E2E
on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'e2e_tests/**', '.github/workflows/e2e.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'e2e_tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd frontend && npm ci
      - run: cd backend && ./make.sh generate_client --check
      - run: cd e2e_tests && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e_tests && ./make.sh lint && ./make.sh test_e2e
