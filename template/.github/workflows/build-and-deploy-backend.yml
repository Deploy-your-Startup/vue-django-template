name: Build and Deploy Application

on:
  # PRs run build + test + lint. Every deploy step in the shared workflow is
  # guarded by `github.event_name != 'pull_request'` and the image is built but
  # not pushed, so a PR run checks without deploying. Without this trigger the
  # gate would only run after the merge, which cannot block anything.
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e_tests/**'
      - '.dockerignore'
      - '.github/workflows/build-and-deploy-backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e_tests/**'
      - '.dockerignore'
      - '.github/workflows/build-and-deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: production

jobs:
  build-and-deploy:
    uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/workflows/build-and-deploy-service-parallel.yml@§§deploy_your_startup.deploy_ref§§
    with:
      environment: ${{ github.event.inputs.environment || 'production' }}
      platforms: linux/amd64
      service: application
      services: '[{"service":"backend"},{"service":"frontend","require_coverage":false}]'
      run_e2e: false
      e2e_shards: 1
      run_tests: true
      require_coverage: true
      coverage_measured_from: Integration
      # Runs ./make.sh lint in the test image: ruff format --check, ruff check, ty.
      run_lint: true
    secrets:
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
