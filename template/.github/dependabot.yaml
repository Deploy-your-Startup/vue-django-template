version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 2
    directories:
      - /deployment
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    open-pull-requests-limit: 2
    directories:
      - /backend
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directories:
      - /backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    open-pull-requests-limit: 2
    directory: /frontend
    # typescript-eslint 8 supports TypeScript <6.1; lift with toolchain support.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
