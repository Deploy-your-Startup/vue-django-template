apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: frontend-security-headers
  namespace: "{{ k8s_namespace | default('default') }}"
spec:
  headers:
    stsSeconds: 86400
    contentSecurityPolicy: "base-uri 'self'; frame-ancestors 'none'"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: "{{ k8s_namespace | default('default') }}"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ k8s_namespace | default('default') }}-frontend-security-headers@kubernetescrd
    cert-manager.io/issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["{{ base_domain }}"]
      secretName: frontend-tls
  rules:
    - host: "{{ base_domain }}"
      http:
        paths:
{% if oauth2_proxy_enabled | default(false) | bool %}
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { number: 80 }
          - path: /private_api
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { number: 80 }
{% endif %}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
