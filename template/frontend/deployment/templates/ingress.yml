apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: "{{ k8s_namespace | default('default') }}"
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["{{ base_domain }}"]
      secretName: frontend-tls
  rules:
    - host: "{{ base_domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
