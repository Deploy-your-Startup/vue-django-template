apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  namespace: "{{ k8s_namespace | default('default') }}"
type: Opaque
data:
  OAUTH2_PROXY_CLIENT_ID: "{{ oauth2_proxy_client_id | b64encode }}"
  OAUTH2_PROXY_CLIENT_SECRET: "{{ oauth2_proxy_client_secret | b64encode }}"
  # Has to decode to exactly 16, 24 or 32 bytes or oauth2-proxy refuses to
  # start. Stored in the vault already base64-encoded, the way oauth2-proxy
  # expects to read it, so this is the second encoding for Kubernetes.
  OAUTH2_PROXY_COOKIE_SECRET: "{{ oauth2_proxy_cookie_secret | b64encode }}"
