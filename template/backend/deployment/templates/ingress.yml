apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-public
  namespace: "{{ k8s_namespace | default('default') }}"
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: {{ k8s_namespace | default('default') }}-redirect-to-https@kubernetescrd,{{ k8s_namespace | default('default') }}-redirect-to-base@kubernetescrd
spec:
  tls:
    - hosts:
{% for domain in [base_domain] + additional_domains %}
        - "{{ domain }}"
{% endfor %}
      secretName: backend-tls
  rules:
{% for domain in ['backend.' ~ base_domain] + additional_domains %}
    - host: "{{ domain }}"
      http:
        paths:
{% for path in ['/api', '/admin', '/static', '/media', '/docs', '/redoc', '/openapi.json'] %}
          - path: {{ path }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
{% endfor %}
{% endfor %}
