# Extend these module scopes when adding apps or layers (ADR 0011).
source_roots = ["."]
exclude = [".venv/**", "architecture/**", "**/__pycache__/**"]
ignore_type_checking_imports = false
forbid_circular_dependencies = true
layers = ["entrypoints", "services", "models", "contracts"]

[[modules]]
paths = ["api.**", "project.**", "e2e_support.**", "docker_database_url.**"]

[[modules]]
paths = ["api.routes"]
cannot_depend_on = ["api.factories", "api.tests", "e2e_support", "e2e_support.**", "project.test_images", "project.test_testing_integration", "project.testing"]
layer = "entrypoints"

[[modules]]
paths = ["project.asgi", "project.settings", "project.urls", "project.wsgi", "project.htmx", "project.images"]
cannot_depend_on = ["api.factories", "api.tests", "e2e_support", "e2e_support.**", "project.test_images", "project.test_testing_integration", "project.testing"]

[[modules]]
paths = ["api.services"]
cannot_depend_on = ["api.factories", "api.tests", "e2e_support", "e2e_support.**", "project.test_images", "project.test_testing_integration", "project.testing"]
layer = "services"

[[modules]]
paths = ["api.models"]
cannot_depend_on = ["api.factories", "api.tests", "e2e_support", "e2e_support.**", "project.test_images", "project.test_testing_integration", "project.testing"]
layer = "models"

